[package]
name = "softwheel-resilience"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Composable resilience primitives for Rust distributed systems."
repository = "https://github.com/softwheel/svc-resilience-rs"
license = "MIT"
keywords = ["resilience", "retry", "circuit-breaker", "distributed-systems"]
categories = ["asynchronous", "concurrency", "network-programming"]

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
# Keep dependency requirements broad enough for downstream applications to unify compatible
# versions while developing the crate itself on the latest stable Rust toolchain.
fastrand = "2.5"
tokio = { version = "1.51", features = ["macros", "time"], optional = true }

[dev-dependencies]
# Exact model-checker version keeps concurrency verification reproducible.
loom = "=0.7.2"
tokio = { version = "1.51", features = ["macros", "rt", "time"] }
